<!DOCTYPE html>
<!-- Valery: a quiet writing app with variations and ghosted text. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --font-text: "Crimson Pro", "Iowan Old Style", Georgia, Cambria, "Times New Roman", serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    --size-text: clamp(1.1875rem, 1.05rem + 0.45vw, 1.375rem);
    --size-ui: 0.8125rem;
    --measure: 66ch;
    --space-1: 8px; --space-2: 16px; --space-3: 24px; --space-6: 48px; --space-12: 96px;

    --bg: #1a1714;
    --surface: #24201c;
    --text: #e8e4db;
    --text-strong: #f6f2e9;
    --muted: #9a9589;
    --syntax: #5a554c;
    --border: #3a342d;
    --primary: #6ba6d9;
    --primary-soft: rgba(107, 166, 217, 0.45);
    --selection: rgba(107, 166, 217, 0.3);
    --code-bg: rgba(255, 255, 255, 0.07);
    --hover: #332d28;
  }
  :root[data-theme="light"] {
      color-scheme: light;
      --bg: #fcf9f2;
      --surface: #ffffff;
      --text: #1f1d1a;
      --text-strong: #000000;
      --muted: #6b665c;
      --syntax: #bdb7a8;
      --border: #ddd6c7;
      --primary: #004080;
      --primary-soft: rgba(0, 64, 128, 0.45);
      --selection: rgba(0, 64, 128, 0.2);
      --code-bg: rgba(0, 0, 0, 0.06);
      --hover: #f0ede6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  button, input { font: inherit; }
  #wrap {
    --pad-x: max(var(--space-6), calc((100% - var(--measure)) / 2));
    position: absolute; inset: 0;
  }

  /* The overlay and the textarea must share every metric that affects layout. */
  #overlay, #editor {
    position: absolute; inset: 0;
    margin: 0; border: 0;
    padding: var(--space-12) var(--pad-x) 40vh;
    font-family: var(--font-text);
    font-size: var(--size-text);
    line-height: 1.7;
    letter-spacing: 0;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    font-kerning: normal;
    font-variant-ligatures: none;
    font-variant-numeric: lining-nums proportional-nums;
    text-rendering: optimizeLegibility;
    tab-size: 4;
  }
  #overlay { overflow: hidden; pointer-events: none; color: var(--text); }
  #overlay-inner { will-change: transform; }
  #editor {
    z-index: 2;
    background: transparent; color: transparent; caret-color: var(--primary);
    outline: none; resize: none; overflow: auto; scrollbar-width: none;
  }
  #editor::-webkit-scrollbar { display: none; }
  #editor::selection { background: var(--selection); }

  /* Cosmetics change only color, background, shadow, and underline,
     because these never change character widths. */
  .variant {
    position: relative;
    text-decoration: underline dotted; text-decoration-color: var(--primary-soft);
    text-decoration-thickness: 1px; text-underline-offset: 6px;
    transition: text-decoration-color 0.12s ease, text-decoration-thickness 0.12s ease;
  }
  .variant.is-hovered {
    text-decoration-color: var(--primary);
    text-decoration-thickness: 1.5px;
  }
  .variant-dots {
    position: absolute;
    left: 50%;
    top: calc(100% + 5px);
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 6px;
    padding: 0 2px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s ease;
    white-space: nowrap;
  }
  .variant-dots .variant-dot {
    width: 5px;
    height: 5px;
    border: 1px solid var(--primary-soft);
    border-radius: 50%;
    background: transparent;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
  }
  .variant-dots .variant-dot.active {
    background: var(--primary);
    border-color: var(--primary);
    transform: scale(1.05);
  }
  .variant.is-hovered .variant-dots { opacity: 1; }
  .block-shell {
    display: inline-block;
    width: 100%;
    vertical-align: top;
    min-height: 1.7em;
    position: relative;
  }
  .block-variant {
    position: relative;
    display: block;
    width: 100%;
  }
  .block-variant-marker {
    position: absolute;
    top: 0; bottom: 0; left: -12px; width: 1px;
    background: var(--primary-soft);
    opacity: 0.24;
    transition: opacity 0.12s ease, background 0.12s ease;
    pointer-events: none;
  }
  .block-variant-dots {
    position: absolute;
    left: -11px; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .block-variant-dot {
    width: 5px; height: 5px;
    border: 1px solid var(--primary-soft);
    border-radius: 50%;
    background: transparent;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
  }
  .block-variant-dot.active {
    background: var(--primary);
    border-color: var(--primary);
    transform: scale(1.08);
  }
  .block-variant.is-hovered .block-variant-marker {
    opacity: 0.72;
    background: var(--primary);
  }
  .block-variant.is-hovered .block-variant-dots { opacity: 1; }

  .ghost {
    opacity: 0.1;
    transition: opacity var(--ghost-reveal-duration, 220ms) ease;
  }
  .ghost.is-hovered { opacity: 0.28; }
  .md-syntax { color: var(--syntax); }
  .md-strong { color: var(--text-strong); text-shadow: 0.45px 0 0 currentColor; }
  .md-em { color: var(--text-strong); text-decoration: underline; text-decoration-color: var(--syntax); text-decoration-thickness: 1px; text-underline-offset: 5px; }
  .md-code { background: var(--code-bg); border-radius: 4px; color: var(--primary); }
  .blk-heading1 { color: var(--text-strong); text-shadow: 0.6px 0 0 currentColor, -0.3px 0 0 currentColor; }
  .blk-heading2 { color: var(--text-strong); text-shadow: 0.5px 0 0 currentColor; }
  .blk-heading3 { color: var(--text-strong); text-shadow: 0.35px 0 0 currentColor; }
  .blk-quote { color: var(--muted); }
  /* Heading hashes hang in the left margin. They are absolutely positioned,
     so they take no space in the line and cannot shift the text. */
  .blk-heading1, .blk-heading2, .blk-heading3 { position: relative; }
  .blk-heading1::before, .blk-heading2::before, .blk-heading3::before {
    position: absolute; top: 0; left: 0; transform: translateX(-100%);
    padding-right: 0.7em; line-height: normal; white-space: pre;
    color: var(--syntax); text-shadow: none; pointer-events: none;
  }
  .blk-heading1::before { content: '#'; }
  .blk-heading2::before { content: '##'; }
  .blk-heading3::before { content: '###'; }
  @media (max-width: 640px) {
    #wrap { --pad-x: max(40px, calc((100% - var(--measure)) / 2)); }
    .blk-heading1::before, .blk-heading2::before, .blk-heading3::before { font-size: 0.6em; padding-right: 0.5em; }
  }

  .corner {
    position: absolute; bottom: var(--space-2);
    z-index: 5;
    font-family: var(--font-ui); font-size: var(--size-ui); line-height: 1;
    color: var(--muted); opacity: 0.55;
    transition: opacity 0.2s;
  }
  #count { left: var(--space-3); pointer-events: auto; font-variant-numeric: tabular-nums; cursor: default; }
  #actions { position: absolute; right: var(--space-3); bottom: var(--space-2); z-index: 5; display: flex; gap: var(--space-2); }
  #actions button {
    position: relative;
    padding: var(--space-1); margin: calc(var(--space-1) * -1) 0;
    font-family: var(--font-ui); font-size: var(--size-ui); line-height: 1;
    color: var(--muted); opacity: 0.55; transition: opacity 0.2s, color 0.2s, background 0.2s;
    background: transparent; border: 0; border-radius: 4px; cursor: pointer;
  }
  #actions button:hover, #actions button:focus-visible { opacity: 1; color: var(--text); background: var(--hover); }
  #actions button:active { background: var(--border); }
  #actions button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  #wrap:focus-within #count { opacity: 0.4; }

  .corner-hint {
    position: absolute;
    left: 50%; bottom: calc(100% + 10px);
    transform: translate(-50%, 4px);
    padding: 5px 8px 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--muted);
    font-family: var(--font-ui);
    font-size: 0.68rem;
    line-height: 1;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  #theme:hover .corner-hint, #theme:focus-visible .corner-hint {
    opacity: 0.95;
    transform: translate(-50%, 0);
  }

  #count-detail {
    position: fixed;
    left: 12px;
    bottom: 48px;
    z-index: 20;
    min-width: 156px;
    padding: 8px 10px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
    font-family: var(--font-ui);
    font-size: 0.7rem;
    line-height: 1.45;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(3px);
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  #count.is-hovered + #actions + #count-detail,
  #count-detail.visible {
    opacity: 0.96;
    transform: translateY(0);
  }
  #count-detail strong { color: var(--text); font-weight: 500; }

  #ctxmenu {
    position: fixed; display: none; z-index: 100;
    min-width: 240px; max-width: 420px; padding: 4px 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--font-ui); font-size: var(--size-ui); user-select: none;
  }
  #ctxmenu.visible { display: block; }
  #ctxmenu .item {
    display: flex; align-items: baseline; gap: var(--space-1);
    padding: 8px var(--space-2); cursor: pointer; color: var(--text);
    white-space: nowrap; overflow: hidden;
  }
  #ctxmenu .item:hover { background: var(--hover); }
  #ctxmenu .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #ctxmenu .label::before { content: '○ '; color: var(--muted); }
  #ctxmenu .item.active { color: var(--primary); }
  #ctxmenu .item.active .label::before { content: '● '; color: var(--primary); }
  #ctxmenu .item.add .label::before { content: '+ '; color: var(--muted); }
  #ctxmenu .item.plain .label::before { content: ''; }
  #ctxmenu .shortcut { margin-left: auto; flex-shrink: 0; color: var(--muted); }
  #ctxmenu .header { padding: 8px var(--space-2) 4px; color: var(--muted); }
  #ctxmenu .divider { height: 1px; background: var(--border); margin: 4px 0; }
</style>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('valery:theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div id="wrap">
  <div id="overlay" aria-hidden="true"><div id="overlay-inner"></div></div>
  <textarea id="editor" aria-label="Document" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  <div id="count" class="corner">0 words</div>
  <div id="actions">
    <button id="theme" type="button" aria-label="Switch theme">
      <span id="theme-label"></span>
      <span class="corner-hint" id="theme-hint"></span>
    </button>
    <button id="export" type="button" title="Export as Markdown (Ctrl+S)" aria-label="Export as Markdown">Export</button>
  </div>
  <div id="count-detail" aria-hidden="true"></div>
</div>
<div id="ctxmenu" role="menu"></div>
<script>
/* MODEL
   Document = { id, schemaVersion, blocks: Block[] }
   Block    = { id, kind?, content: Inline[], variantGroup? }  kind: paragraph | heading1-3 | quote | bullet | numbered
   Block variantGroup = { id, active, variants: [{ id, content: Inline[] }, ...] }
   Inline   = text | ghost | variant | mark (strong, em, code)
   The textarea holds the Markdown form: block prefix + flattened active content, joined by newlines. */

const DOCUMENT_SCHEMA_VERSION = 3;
const BLOCK_PREFIXES = { quote: '> ', bullet: '- ', numbered: '1. ' };
const MARKDOWN_PREFIXES = { heading1: '# ', heading2: '## ', heading3: '### ', ...BLOCK_PREFIXES };
const blockPrefix = (kind) => BLOCK_PREFIXES[kind] || '';
const markdownPrefix = (kind) => MARKDOWN_PREFIXES[kind] || '';
const blockContentStart = (b) => blockPrefix(b.kind).length;
const blockLength = (b) => blockContentStart(b) + contentLength(activeBlockContent(b));

const INPUT_RULES = [
  { re: /^### $/, kind: 'heading3' }, { re: /^## $/, kind: 'heading2' }, { re: /^# $/, kind: 'heading1' },
  { re: /^> $/, kind: 'quote' }, { re: /^- $/, kind: 'bullet' }, { re: /^\* $/, kind: 'bullet' }, { re: /^1\. $/, kind: 'numbered' },
];
const MARK_OPEN = { strong: '**', em: '*', code: '`' };
const MARK_CLOSE = MARK_OPEN;

let _idc = Date.now();
const genId = (p = 'n') => p + (++_idc);

function nodeLength(node) {
  if (node.type === 'text') return node.text.length;
  if (node.type === 'ghost') return contentLength(node.content);
  if (node.type === 'variant') return contentLength(node.variants[node.active]);
  if (node.type === 'mark') return MARK_OPEN[node.kind].length + contentLength(node.content) + MARK_CLOSE[node.kind].length;
  return 0;
}
function contentLength(content) { let n = 0; for (const node of content) n += nodeLength(node); return n; }
function flattenContent(content) {
  let s = '';
  for (const node of content) {
    if (node.type === 'text') s += node.text;
    else if (node.type === 'ghost') s += flattenContent(node.content);
    else if (node.type === 'variant') s += flattenContent(node.variants[node.active]);
    else if (node.type === 'mark') s += MARK_OPEN[node.kind] + flattenContent(node.content) + MARK_CLOSE[node.kind];
  }
  return s;
}
const truncate = (s, n) => s.length <= n ? s : s.slice(0, n - 1) + '…';

function normalize(content) {
  const out = [];
  for (const node of content) {
    if (node.type === 'text') {
      if (!node.text) continue;
      if (out.length && out[out.length - 1].type === 'text') out[out.length - 1].text += node.text;
      else out.push({ type: 'text', text: node.text });
    } else if (node.type === 'ghost') {
      const inner = normalize(node.content);
      if (inner.length) out.push({ type: 'ghost', id: node.id, content: inner });
    } else if (node.type === 'variant') {
      const variants = Array.isArray(node.variants) && node.variants.length ? node.variants.map(normalize) : [[]];
      const active = Math.max(0, Math.min(Number.isInteger(node.active) ? node.active : 0, variants.length - 1));
      out.push({ type: 'variant', id: node.id, active, variants });
    } else if (node.type === 'mark') {
      const inner = normalize(node.content);
      const last = out[out.length - 1];
      if (last && last.type === 'mark' && last.kind === node.kind) last.content = normalize([...last.content, ...inner]);
      else if (inner.length || node.kind) out.push({ type: 'mark', id: node.id, kind: node.kind, content: inner });
    }
  }
  return out;
}

function cloneContentWithNewIds(content) {
  return content.map((node) => {
    if (node.type === 'text') return { type: 'text', text: node.text };
    if (node.type === 'ghost') return { type: 'ghost', id: genId('g'), content: cloneContentWithNewIds(node.content || []) };
    if (node.type === 'variant') return { type: 'variant', id: genId('v'), active: node.active || 0, variants: (node.variants || []).map(cloneContentWithNewIds) };
    if (node.type === 'mark') return { type: 'mark', id: genId('mk'), kind: node.kind, content: cloneContentWithNewIds(node.content || []) };
    return node;
  });
}
function activeBlockVariant(block) {
  const group = block && block.variantGroup;
  if (!group || !Array.isArray(group.variants) || !group.variants.length) return null;
  return group.variants[Math.max(0, Math.min(group.active || 0, group.variants.length - 1))];
}
function activeBlockContent(block) {
  const v = activeBlockVariant(block);
  return v ? v.content : block.content;
}
function blockHasVariants(block) {
  return !!(block && block.variantGroup && Array.isArray(block.variantGroup.variants) && block.variantGroup.variants.length > 1);
}
function syncActiveBlockContent(block) {
  const active = activeBlockVariant(block);
  if (active) block.content = active.content;
  return block.content;
}
function ensureBlockVariantIds(block) {
  if (!block.variantGroup) {
    if (!Array.isArray(block.content)) block.content = [];
    return;
  }
  const group = block.variantGroup;
  if (!group.id) group.id = genId('bv');
  if (!Array.isArray(group.variants) || !group.variants.length) { delete block.variantGroup; return; }
  group.variants = group.variants.map((v) => ({
    id: v && v.id ? v.id : genId('bvv'),
    content: normalize(v && Array.isArray(v.content) ? v.content : [])
  }));
  group.active = Math.max(0, Math.min(Number.isInteger(group.active) ? group.active : 0, group.variants.length - 1));
  group.variants.forEach(v => ensureContentIds(v.content));
  syncActiveBlockContent(block);
}
function createBlockVariantGroup(block) {
  const current = activeBlockContent(block);
  const group = {
    id: genId('bv'),
    active: 0,
    variants: [
      { id: genId('bvv'), content: current },
    ],
  };
  block.variantGroup = group;
  syncActiveBlockContent(block);
  return group;
}
function mergeBlocksPreservingVariants(leftBlock, rightBlock) {
  const leftHas = blockHasVariants(leftBlock);
  const rightHas = blockHasVariants(rightBlock);
  if (!leftHas && !rightHas) {
    leftBlock.content = normalize([...activeBlockContent(leftBlock), ...activeBlockContent(rightBlock)]);
    return;
  }
  if (leftHas && !rightHas) {
    const rightContent = activeBlockContent(rightBlock);
    leftBlock.variantGroup.variants = leftBlock.variantGroup.variants.map(v => ({
      ...v, content: normalize([...v.content, ...cloneContentWithNewIds(rightContent)])
    }));
    syncActiveBlockContent(leftBlock);
    return;
  }
  if (!leftHas && rightHas) {
    const leftContent = activeBlockContent(leftBlock);
    const variants = rightBlock.variantGroup.variants.map(v => ({
      id: genId('bvv'),
      content: normalize([...cloneContentWithNewIds(leftContent), ...v.content]),
    }));
    leftBlock.variantGroup = {
      id: genId('bv'),
      active: rightBlock.variantGroup.active,
      variants,
    };
    syncActiveBlockContent(leftBlock);
    return;
  }
  const leftGroup = leftBlock.variantGroup, rightGroup = rightBlock.variantGroup;
  const variants = [];
  for (let li = 0; li < leftGroup.variants.length; li++) {
    for (let ri = 0; ri < rightGroup.variants.length; ri++) {
      variants.push({
        id: genId('bvv'),
        content: normalize([
          ...cloneContentWithNewIds(leftGroup.variants[li].content),
          ...cloneContentWithNewIds(rightGroup.variants[ri].content),
        ]),
      });
    }
  }
  leftBlock.variantGroup = {
    id: genId('bv'),
    active: leftBlock.variantGroup.active * rightGroup.variants.length + rightBlock.variantGroup.active,
    variants,
  };
  syncActiveBlockContent(leftBlock);
}
function truncateWords(s, count) {
  const words = s.replace(/\s+/g, ' ').trim().split(/\s+/).filter(Boolean);
  if (words.length <= count) return words.join(' ');
  return words.slice(0, count).join(' ') + '…';
}

function ensureContentIds(content) {
  for (const node of content) {
    if (node.type === 'ghost') {
      if (!node.id) node.id = genId('g');
      ensureContentIds(node.content || []);
    } else if (node.type === 'variant') {
      if (!node.id) node.id = genId('v');
      if (!Array.isArray(node.variants) || !node.variants.length) node.variants = [[]];
      if (!Number.isInteger(node.active)) node.active = 0;
      node.active = Math.max(0, Math.min(node.active, node.variants.length - 1));
      node.variants.forEach(ensureContentIds);
    } else if (node.type === 'mark') {
      if (!node.id) node.id = genId('mk');
      ensureContentIds(node.content || []);
    }
  }
}
function ensureDocumentIds(document) {
  if (!document.id) document.id = genId('d');
  document.schemaVersion = DOCUMENT_SCHEMA_VERSION;
  if (!Array.isArray(document.blocks) || !document.blocks.length) {
    document.blocks = [{ id: genId('b'), kind: 'paragraph', content: [] }];
  }
  for (const block of document.blocks) {
    if (!block.id) block.id = genId('b');
    if (!block.kind) block.kind = 'paragraph';
    if (!Array.isArray(block.content)) block.content = [];
    if (block.variantGroup && block.kind !== 'paragraph') delete block.variantGroup;
    if (block.variantGroup) {
      ensureBlockVariantIds(block);
    } else {
      ensureContentIds(block.content);
      block.content = normalize(block.content);
    }
  }
  document.blocks = document.blocks.flatMap(splitBlockOnNewlines);
  return document;
}
function newDocument() {
  return ensureDocumentIds({
    id: genId('d'),
    schemaVersion: DOCUMENT_SCHEMA_VERSION,
    blocks: [{ id: genId('b'), kind: 'paragraph', content: [] }],
  });
}

function snapOffset(content, offset, dir) {
  let result = offset;
  (function walk(nodes, base) {
    let pos = base;
    for (const node of nodes) {
      const len = nodeLength(node);
      if (node.type === 'variant') {
        if (offset > pos && offset < pos + len) result = dir === 'left' ? Math.min(result, pos) : Math.max(result, pos + len);
      } else if (node.type === 'ghost') walk(node.content, pos);
      else if (node.type === 'mark') walk(node.content, pos + MARK_OPEN[node.kind].length);
      pos += len;
    }
  })(content, 0);
  return result;
}

function snapOutOfDelimiters(content, offset) {
  let result = offset;
  function walk(nodes, base) {
    let pos = base;
    for (const node of nodes) {
      const len = nodeLength(node);
      if (node.type === 'mark') {
        const contentStart = pos + MARK_OPEN[node.kind].length;
        const contentEnd = contentStart + contentLength(node.content);
        const nodeEnd = pos + len;
        if (offset > pos && offset < contentStart) { result = contentStart; return; }

}
function setHoveredBlockVariant(el) {
  const id = el && el.dataset ? el.dataset.blockId : null;
  if (!id) return clearHoverState();
  ui.hoveredVariantId = null; ui.hoveredGhostId = null; ui.hoveredVariantVisible = false;
  overlayInner.querySelectorAll('.variant.is-hovered, .ghost.is-hovered').forEach(n => n.classList.remove('is-hovered'));
  clearTimeout(ui.hoverTimer); ui.hoverTimer = null; clearTimeout(ui.ghostRevealTimer); ui.ghostRevealTimer = null;
  if (ui.hoveredBlockId !== id) {
    overlayInner.querySelectorAll('.block-variant.is-hovered').forEach(n => n.classList.remove('is-hovered'));
    clearTimeout(ui.blockHoverTimer); ui.blockHoverTimer = null;
    ui.hoveredBlockId = id; ui.hoveredBlockVisible = false;
  }
  if (ui.hoveredBlockVisible) { el.classList.add('is-hovered'); return; }
  if (ui.blockHoverTimer) return;
  ui.blockHoverTimer = setTimeout(() => { if (ui.hoveredBlockId === id && document.body.contains(el)) { el.classList.add('is-hovered'); ui.hoveredBlockVisible = true; } }, VARIANT_HOVER_DELAY);
}
function refreshHoverFromLastPointer() {
  if (!ui.lastPointer || !overlayInner.isConnected) return;
  const hit = spanAtPoint(ui.lastPointer.x, ui.lastPointer.y);
  if (hit.variant) setHoveredVariant(hit.variant);
  else if (hit.ghost) setHoveredGhost(hit.ghost);
  else if (hit.blockVariant) setHoveredBlockVariant(hit.blockVariant);
  else clearHoverState();
}
function onEditorPointerMove(e) {
  ui.lastPointer = { x: e.clientX, y: e.clientY };
  if (ui.pointerFrame) return;
  ui.pointerFrame = requestAnimationFrame(() => { ui.pointerFrame = 0; refreshHoverFromLastPointer(); });
}
function hoveredVariantNode() {
  if (!ui.hoveredVariantId) return null;
  const entry = findVariantEntry(doc, ui.hoveredVariantId);
  return entry ? entry.variant : null;
}
function findVariantEntry(document, id) {
  function walk(nodes) {
    for (const node of nodes) {
      if (node.type === 'variant') {
        if (node.id === id) return node;
        for (const variant of node.variants) { const r = walk(variant); if (r) return r; }
      } else if (node.type === 'ghost' || node.type === 'mark') {
        const r = walk(node.content); if (r) return r;
      }
    }
    return null;
  }
  for (let blockIndex = 0; blockIndex < document.blocks.length; blockIndex++) {
    const variant = walk(activeBlockContent(document.blocks[blockIndex]));
    if (variant) return { block: document.blocks[blockIndex], blockIndex, variant };
  }
  return null;
}
function findBlockVariantEntry(document, id) {
  if (!id) return null;
  for (let blockIndex = 0; blockIndex < document.blocks.length; blockIndex++) {
    const block = document.blocks[blockIndex];
    if (block.id === id && blockHasVariants(block)) return { block, blockIndex, group: block.variantGroup };
  }
  return null;
}

/* EXPORT */

function exportMarkdown() {
  const markdown = doc.blocks.map(b => markdownPrefix(b.kind) + flattenContent(b.content)).join('\n');
  const blob = new Blob([markdown + '\n'], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'draft.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.getElementById('export').addEventListener('click', exportMarkdown);

/* THEME */

function paintThemeButton() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const target = dark ? 'light' : 'dark';
  const label = dark ? 'Light mode' : 'Dark mode';
  const hint = dark ? 'Switch to light' : 'Switch to dark';
  themeLabel.textContent = label;
  themeHint.textContent = hint;
  themeBtn.setAttribute('aria-label', `Switch to ${target} mode`);
  themeBtn.title = `Switch to ${target} mode`;
}
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('valery:theme', next); } catch (err) {}
  paintThemeButton();
  editor.focus();
});
paintThemeButton();

/* WORD COUNT HOVER */

countEl.addEventListener('mouseenter', () => {
  countEl.classList.add('is-hovered');
  countDetail.classList.add('visible');
});
countEl.addEventListener('mouseleave', () => {
  countEl.classList.remove('is-hovered');
  countDetail.classList.remove('visible');
});

/* KEYBOARD */

window.addEventListener('keydown', (e) => {
  if (ui.hoveredBlockId && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const entry = findBlockVariantEntry(doc, ui.hoveredBlockId);
    if (entry && entry.group.variants.length > 1) {
      e.preventDefault();
      cycleBlockVariantPreservingSelection(entry, e.key === 'ArrowDown' ? 1 : -1);
      return;
    }
  }
  if (ui.hoveredVariantId && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const v = hoveredVariantNode();
    e.preventDefault();
    if (v && v.variants.length > 1) cycleVariantPreservingSelection(v, e.key === 'ArrowRight' ? 1 : -1);
    return;
  }
});

editor.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (mod && !e.altKey && key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && !e.altKey && key === 'y') { e.preventDefault(); redo(); return; }
  if (mod && !e.altKey && key === 'b') { e.preventDefault(); toggleMark('strong'); return; }
  if (mod && !e.altKey && key === 'i') { e.preventDefault(); toggleMark('em'); return; }
  if (mod && !e.altKey && key === '`') { e.preventDefault(); toggleMark('code'); return; }
  if (mod && !e.altKey && key === 's') { e.preventDefault(); exportMarkdown(); return; }
  if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); cycleAtCaret(-1); return; }
  if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); cycleAtCaret(+1); return; }
  if (mod && !e.altKey && key === 'g') { e.preventDefault(); e.shiftKey ? doRevive() : doGhost(); }
});

editor.addEventListener('dblclick', () => {
  queueMicrotask(() => {
    const s = editor.selectionStart, en = editor.selectionEnd;
    if (s === en) return;
    const text = editor.value;
    let newEnd = en;
    while (newEnd > s && /\s/.test(text[newEnd - 1])) newEnd--;
    let newStart = s;
    while (newStart < newEnd && /\s/.test(text[newStart])) newStart++;
    if (newStart !== s || newEnd !== en) editor.setSelectionRange(newStart, newEnd);
  });
});

/* CONTEXT MENU */

const ctxmenu = document.getElementById('ctxmenu');
let ctxOpen = false;
function closeCtxMenu() { ctxmenu.classList.remove('visible'); ctxmenu.innerHTML = ''; ctxOpen = false; }
function showCtxMenu(x, y, items) {
  ctxmenu.innerHTML = '';
  for (const it of items) {
    const el = document.createElement('div');
    if (it.type === 'header') { el.className = 'header'; el.textContent = it.label; ctxmenu.appendChild(el); continue; }
    if (it.type === 'divider') { el.className = 'divider'; ctxmenu.appendChild(el); continue; }
    el.className = 'item' + (it.active ? ' active' : '') + (it.add ? ' add' : '') + (it.plain ? ' plain' : '');
    el.setAttribute('role', 'menuitem');
    if (it.title) el.title = it.title;
    const label = document.createElement('span');
    label.className = 'label'; label.textContent = it.label;
    el.appendChild(label);
    if (it.shortcut) {
      const sc = document.createElement('span');
      sc.className = 'shortcut'; sc.textContent = it.shortcut;
      el.appendChild(sc);
    }
    el.addEventListener('mousedown', (ev) => { ev.preventDefault(); ev.stopPropagation(); closeCtxMenu(); it.action(); });
    ctxmenu.appendChild(el);
  }
  ctxmenu.classList.add('visible');
  const r = ctxmenu.getBoundingClientRect();
  ctxmenu.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
  ctxmenu.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
  ctxOpen = true;
}
function paragraphVariantPreview(variant) {
  return truncateWords(contentPlainText(variant.content, true), 7) || '(empty)';
}
function setParagraphVariantActive(entry, altIndex) {
  setBlockVariantActive(entry, altIndex, true);
}

function setVariantActive(block, blockIndex, variant, altIndex, caretOffsetInBlock) {
  const range = findNodeRange(activeBlockContent(block), variant);
  if (!range) return;
  pushHistory('cycle');
  const rel = caretOffsetInBlock - range.start;
  variant.active = altIndex;
  render();
  const newRange = findNodeRange(activeBlockContent(block), variant);
  if (!newRange) return;
  setCaret(flatOffsetOfBlockContent(blockIndex) + newRange.start + Math.max(0, Math.min(rel, contentLength(variant.variants[altIndex]))));
}
function selectFlatRange(a, b) { editor.focus(); editor.setSelectionRange(a, b); }
function caretFromPoint(x, y) {
  let hit = null;
  if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); if (p) hit = { node: p.offsetNode, offset: p.offset }; }
  else if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(x, y); if (r) hit = { node: r.startContainer, offset: r.startOffset }; }
  if (!hit || !hit.node || !overlayInner.contains(hit.node)) return null;
  const el = hit.node.nodeType === Node.ELEMENT_NODE ? hit.node : hit.node.parentElement;
  const shell = el && el.closest ? el.closest('.block-shell') : null;
  if (!shell) return null;
  const blockIndex = Number(shell.dataset.blockIndex);
  if (!Number.isInteger(blockIndex) || !doc.blocks[blockIndex]) return null;
  const range = document.createRange();
  try { range.selectNodeContents(shell); range.setEnd(hit.node, hit.offset); return flatOffsetOfBlockStart(blockIndex) + range.toString().length; }
  catch (err) { return flatOffsetOfBlockStart(blockIndex); }
}

editor.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const s0 = editor.selectionStart, e0 = editor.selectionEnd;
  const hit = spanAtPoint(e.clientX, e.clientY);
  const clickPos = caretFromPoint(e.clientX, e.clientY);
  if (clickPos != null && (clickPos < s0 || clickPos > e0)) { editor.focus(); setCaret(clickPos); }
  const s = editor.selectionStart, en = editor.selectionEnd;
  const loc = locateFlat(s);
  const items = [];
  let paragraphVariationAction = null;
  const blockHit = hit.blockVariant ? findBlockVariantEntry(doc, hit.blockVariant.dataset.blockId) : null;
  const blockEntry = blockHit || (loc.block && blockHasVariants(loc.block) && loc.block.kind === 'paragraph' ? findBlockVariantEntry(doc, loc.block.id) : null);

  if (blockEntry) {
    const group = blockEntry.group;
    items.push({ type: 'header', label: `Paragraph variations (${group.variants.length})` });
    group.variants.forEach((v, i) => {
      const full = contentPlainText(v.content, true);
      items.push({ label: paragraphVariantPreview(v), title: full || '(empty)', active: i === group.active, action: () => setParagraphVariantActive(blockEntry, i) });
    });
    paragraphVariationAction = () => beginNewBlockVariant(blockEntry.block, blockEntry.blockIndex);
  } else if (loc.block && loc.block.kind === 'paragraph' && contentLength(activeBlockContent(loc.block)) > 0 && s === en && !loc.inPrefix) {
    paragraphVariationAction = () => beginNewBlockVariant(loc.block, loc.blockIndex);
  }

  const v = variantAtOffset(activeBlockContent(loc.block), loc.offsetInBlock);
  if (v) {
    items.push({ type: 'header', label: v.variants.length > 1 ? `Variations (${v.variants.length})` : 'Variation' });
    v.variants.forEach((alt, i) => {
      const full = flattenContent(alt);
      items.push({ label: truncate(full.replace(/\n/g, ' ⏎ '), 64) || '(empty)', title: full || '(empty)', active: i === v.active, action: () => setVariantActive(loc.block, loc.blockIndex, v, i, loc.offsetInBlock) });
    });
    const vRange = findNodeRange(activeBlockContent(loc.block), v);
    if (vRange) {
      const base = flatOffsetOfBlockContent(loc.blockIndex);
      items.push({ add: true, label: 'Write a new variation', action: () => selectFlatRange(base + vRange.start, base + vRange.end) });
    }
    items.push({ type: 'divider' });
  } else if (s === en && !loc.inPrefix) {
    const word = wordRangeAt(editor.value, s);
    if (word) items.push({ add: true, label: `New variation of ‘${truncate(editor.value.slice(word.start, word.end), 32)}’`, action: () => selectFlatRange(word.start, word.end) });
    const sent = sentenceRangeAt(editor.value, s);
    if (sent && (!word || sent.end - sent.start > word.end - word.start)) items.push({ add: true, label: 'New variation of this sentence', action: () => selectFlatRange(sent.start, sent.end) });
  } else if (s !== en) {
    const t = trimSelection(s, en);
    if (t) items.push({ add: true, label: 'Write a new variation', action: () => selectFlatRange(t[0], t[1]) });
  }

  if (s !== en) items.push({ plain: true, label: 'Ghost this text', shortcut: 'Ctrl+G', action: doGhost });
  const ghosts = ghostsAtOffset(activeBlockContent(loc.block), loc.offsetInBlock);
  if (ghosts.length) items.push({ plain: true, label: 'Revive this text', shortcut: 'Ctrl+Shift+G', action: () => { pushHistory('revive'); loc.block.content = normalize(reviveGhostById(activeBlockContent(loc.block), ghosts[0].id)); render(); setCaret(s); } });

  if (paragraphVariationAction) {
    while (items.length && items[items.length - 1].type === 'divider') items.pop();
    if (items.length) items.push({ type: 'divider' });
    items.push({ add: true, label: 'New variation of this paragraph', action: paragraphVariationAction });
  }

  while (items.length && items[items.length - 1].type === 'divider') items.pop();
  if (!items.length) return;
  showCtxMenu(e.clientX, e.clientY, items);
});

window.addEventListener('mousedown', () => { if (ctxOpen) closeCtxMenu(); }, true);
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ctxOpen) { e.preventDefault(); closeCtxMenu(); } }, true);
window.addEventListener('resize', () => { syncOverlay(); if (ctxOpen) closeCtxMenu(); refreshHoverFromLastPointer(); });
window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    clearTimeout(saveTimer);
    const snapshotDoc = { id: doc.id, schemaVersion: DOCUMENT_SCHEMA_VERSION, blocks: doc.blocks };
    saveQueue = saveQueue.then(() => persistDocumentNow(snapshotDoc)).catch(() => {});
  }
});

/* INIT */

async function boot() {
  try {
    doc = await loadStoredDocument();
  } catch (err) {
    doc = localStorageDocument() || newDocument();
  }
  ensureDocumentIds(doc);
  persistenceReady = true;
  render({ persist: false });
  editor.focus();
  setCaret(editor.value.length);
}
boot();
</script>
</body>
